services:
  database:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buldez}
      POSTGRES_USER: ${POSTGRES_USER:-buldez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: "8081"
      FRONTEND_ORIGIN: http://localhost:5173,http://localhost:8787
      DATABASE_URL: postgres://${POSTGRES_USER:-buldez}:${POSTGRES_PASSWORD:-change-me}@database:5432/${POSTGRES_DB:-buldez}?sslmode=disable
      BACKEND_API_TOKEN: ${BACKEND_API_TOKEN:-local-development-token}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-БулДез Контрол}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Администратор}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-this-password}
    ports:
      - "8081:8081"

volumes:
  postgres_data:
